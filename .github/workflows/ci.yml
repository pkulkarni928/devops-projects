name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 01-simple-cicd

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t simple-cicd:${{ github.sha }} .
      
      - name: Run Docker container
        run: docker run -d --name simple-cicd -p 5000:5000 simple-cicd:${{ github.sha }}

      - name: Test running container
        run: |
          sleep 3
          curl --fail http://localhost:5000

      - name: Show running containers
        run: docker ps